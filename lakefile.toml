name = "modeljs_proofs"
defaultTargets = ["Analysis"]

[[lean_lib]]
name = "Analysis"
srcDir = "analysis"
# Every module of the library must be listed here: a file under analysis/
# that is not listed is silently skipped by `lake build`.
globs = [
    "CoreJsSyntax",
    "CoreJsSemantics",
    "CoreJsAutomatonSyntax",
    "CoreJsAutomatonSemantics",
    "CoreJsAutomatonRelation",
    "CoreJsAutomatonTotality",
    "CoreJsAutomatonSoundness",
    "CoreJsQuerySyntax",
    "CoreJsQuerySemantics",
    "CoreJsQueryBridge",
    "CoreJsQueryTests",
    "CoreJsFoLtl",
    "CoreJsFoLtlTests",
    "CoreJsQueryToLtl",
]
